name: Ubuntu Verification

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  DJANGO_SECRET_KEY: ci-secret-key
  DJANGO_DEBUG: "True"
  DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost"

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: altixedu

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ../requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Sync database
        run: python manage.py migrate --run-syncdb --noinput

      - name: Run Django test suite
        run: python manage.py test

  frontend:
    name: Frontend Quality
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit -- --config vitest.config.js

      - name: Build frontend
        run: npm run build

  e2e-ubuntu:
    name: Live E2E on Ubuntu
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Prepare backend data
        working-directory: altixedu
        run: |
          python manage.py migrate --run-syncdb --noinput
          python manage.py shell -c "from seed_live_demo import run; run()"

      - name: Start Django API
        working-directory: altixedu
        run: |
          nohup python manage.py runserver 127.0.0.1:8000 --noreload > ../django-server.log 2>&1 &

      - name: Wait for backend
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/api/platform/health/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Backend failed to become ready"
          cat django-server.log || true
          exit 1

      - name: Run live API smoke checks
        working-directory: altixedu
        run: python live_api_smoke.py

      - name: Run Playwright live role flows
        working-directory: frontend
        run: npx playwright test tests/e2e/live-real-api.spec.js tests/e2e/authenticated-workspaces.spec.js tests/e2e/role-flows.spec.js --workers=1

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

      - name: Upload Django log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: django-server-log
          path: django-server.log
          if-no-files-found: ignore
